<body>

<div class="app">

    <!-- HEADER -->

    <header class="top">

        <div class="logo">
            Short<span>Flow</span>
        </div>

        <div class="searchBox">

            <input
                id="search"
                class="search"
                type="search"
                placeholder="Shorts suchen..."
            >

            <button
                class="searchBtn"
                onclick="searchYouTube()"
            >
                🔎
            </button>

        </div>

    </header>


    <!-- FILTER -->

    <div class="filters">

        <button
            class="filter active"
            onclick="changeTopic('',this)"
        >
            Für dich
        </button>

        <button
            class="filter"
            onclick="changeTopic('funny',this)"
        >
            😂 Lustig
        </button>

        <button
            class="filter"
            onclick="changeTopic('gaming',this)"
        >
            🎮 Gaming
        </button>

        <button
            class="filter"
            onclick="changeTopic('music',this)"
        >
            🎵 Musik
        </button>

        <button
            class="filter"
            onclick="changeTopic('sport',this)"
        >
            ⚽ Sport
        </button>

        <button
            class="filter"
            onclick="changeTopic('technology',this)"
        >
            💻 Technik
        </button>

        <button
            class="filter"
            onclick="changeTopic('animals',this)"
        >
            🐶 Tiere
        </button>

    </div>


    <!-- FEED -->

    <main
        id="feed"
        class="feed"
    ></main>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading"
    >
        <div class="loader"></div>
    </div>

</div>


<script>

/* ============================================================
   KONFIGURATION
============================================================ */

/*
   ===========================================================
   HIER DEINEN YOUTUBE API KEY EINTRAGEN
   ===========================================================
*/

const API_KEY = "DEIN_YOUTUBE_API_KEY";


/*
   Deutschland
*/

const REGION = "DE";


/*
   Deutsche Ergebnisse bevorzugen
*/

const LANGUAGE = "de";


/*
   Wie viele Videos pro API-Abfrage.
   Maximal 50.
*/

const RESULTS_PER_REQUEST = 25;


/*
   YouTube Search API ist nicht gleich ein offizieller
   "Shorts-only"-Feed.

   Wir verwenden:
       videoDuration=short

   Dadurch kommen Videos unter 4 Minuten zurück.

   Danach werden sehr kurze Videos bevorzugt.
*/


/* ============================================================
   STATUS
============================================================ */

let videos = [];

let nextPageToken = null;

let loading = false;

let currentQuery = "";

let currentTopic = "";

let liked = new Set();

let activeVideo = null;


/* ============================================================
   DOM
============================================================ */

const feed =
    document.getElementById("feed");

const loadingScreen =
    document.getElementById("loading");

const searchInput =
    document.getElementById("search");


/* ============================================================
   API KEY PRÜFEN
============================================================ */

function hasApiKey(){

    return (
        API_KEY &&
        API_KEY !== "DEIN_YOUTUBE_API_KEY" &&
        API_KEY.length > 20
    );

}


/* ============================================================
   YOUTUBE API URL
============================================================ */

function makeSearchURL(pageToken=""){

    const params =
        new URLSearchParams({

            part:"snippet",

            type:"video",

            maxResults:String(
                RESULTS_PER_REQUEST
            ),

            order:"relevance",

            regionCode:REGION,

            relevanceLanguage:LANGUAGE,

            videoDuration:"short",

            videoEmbeddable:"true",

            safeSearch:"moderate",

            q:
                currentQuery ||
                currentTopic ||
                "shorts"

        });


    if(pageToken){

        params.set(
            "pageToken",
            pageToken
        );

    }


    return (
        "https://www.googleapis.com/youtube/v3/search?" +
        params.toString() +
        "&key=" +
        encodeURIComponent(API_KEY)
    );

}


/* ============================================================
   VIDEOS LADEN
============================================================ */

async function loadVideos(reset=false){

    if(loading) return;

    if(!hasApiKey()){

        showApiMessage();

        return;

    }


    loading = true;


    if(reset){

        videos = [];

        nextPageToken = null;

        feed.innerHTML = "";

    }


    try{

        const url =
            makeSearchURL(
                reset ? "" : nextPageToken
            );


        const response =
            await fetch(url);


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data?.error?.message ||
                "YouTube API Fehler"
            );

        }


        const found =
            (data.items || [])
                .filter(item =>
                    item.id &&
                    item.id.videoId
                )
                .map(item => ({

                    id:item.id.videoId,

                    title:
                        cleanText(
                            item.snippet?.title ||
                            "Short"
                        ),

                    channel:
                        item.snippet?.channelTitle ||
                        "YouTube",

                    channelId:
                        item.snippet?.channelId ||
                        "",

                    published:
                        item.snippet?.publishedAt ||
                        "",

                    description:
                        item.snippet?.description ||
                        ""

                }));


        /*
           Doppelte Videos verhindern.
        */

        for(const video of found){

            if(
                !videos.some(
                    x => x.id === video.id
                )
            ){

                videos.push(video);

                createShort(video);

            }

        }


        nextPageToken =
            data.nextPageToken || null;


        /*
           Wenn sehr wenige Ergebnisse kommen,
           direkt nächste Seite nachladen.
        */

        if(
            found.length < 5 &&
            nextPageToken
        ){

            loading = false;

            await loadVideos(false);

            return;

        }


    }catch(error){

        console.error(error);

        showError(
            error.message ||
            "Fehler beim Laden der Shorts."
        );

    }


    loading = false;

}


/* ============================================================
   SHORT ERSTELLEN
============================================================ */

function createShort(video){

    const section =
        document.createElement("section");


    section.className = "short";


    section.dataset.id =
        video.id;


    section.innerHTML = `

        <div class="video">

            <iframe
                src="https://www.youtube.com/embed/${encodeURIComponent(video.id)}?playsinline=1&rel=0&modestbranding=1"
                title="${escapeHTML(video.title)}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>

        </div>


        <div class="gradient"></div>


        <div class="info">

            <div class="channel">
                @${escapeHTML(video.channel)}
            </div>

            <div class="title">
                ${escapeHTML(video.title)}
            </div>

            <div class="views">
                YouTube Short
            </div>

        </div>


        <div class="actions">

            <button
                class="action likeButton"
                data-id="${video.id}"
                onclick="toggleLike('${video.id}',this)"
            >
                ♥
            </button>

            <div class="actionText">
                Gefällt mir
            </div>


            <button
                class="action"
                onclick="shareVideo('${video.id}')"
            >
                ↗
            </button>

            <div class="actionText">
                Teilen
            </div>


            <button
                class="action"
                onclick="openYouTube('${video.id}')"
            >
                ▶
            </button>

            <div class="actionText">
                YouTube
            </div>

        </div>

    `;


    feed.appendChild(section);

}


/* ============================================================
   SCROLL OBSERVER
============================================================ */

const observer =
    new IntersectionObserver(

        entries => {

            entries.forEach(entry => {

                if(!entry.isIntersecting){
                    return;
                }


                activeVideo =
                    entry.target.dataset.id;


                /*
                   Wenn wir nahe am Ende sind,
                   weitere Shorts laden.
                */

                const sections =
                    document.querySelectorAll(
                        ".short"
                    );


                const index =
                    [...sections]
                        .indexOf(entry.target);


                if(
                    index >=
                    sections.length - 4
                ){

                    if(nextPageToken){
                        loadVideos(false);
                    }

                }

            });

        },

        {
            threshold:.65
        }

    );


/* ============================================================
   OBSERVER NEU ANWENDEN
============================================================ */

function observeShorts(){

    document
        .querySelectorAll(".short")
        .forEach(short => {

            observer.observe(short);

        });

}


/*
   MutationObserver:
   Neue Shorts automatisch beobachten.
*/

const mutationObserver =
    new MutationObserver(() => {

        observeShorts();

    });


mutationObserver.observe(
    feed,
    {
        childList:true
    }
);


/* ============================================================
   SUCHE
============================================================ */

function searchYouTube(){

    const value =
        searchInput.value.trim();


    currentQuery = value;

    currentTopic = "";


    document
        .querySelectorAll(".filter")
        .forEach(x =>
            x.classList.remove("active")
        );


    if(!currentQuery){

        document
            .querySelector(".filter")
            .classList.add("active");

    }


    loadVideos(true);

}


/*
   Enter-Taste
*/

searchInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            searchYouTube();

        }

    }
);


/* ============================================================
   THEMEN
============================================================ */

function changeTopic(topic,button){

    currentTopic = topic;

    currentQuery = "";

    searchInput.value = "";


    document
        .querySelectorAll(".filter")
        .forEach(x =>
            x.classList.remove("active")
        );


    button.classList.add("active");


    loadVideos(true);

}


/* ============================================================
   LIKE
============================================================ */

function toggleLike(id,button){

    if(liked.has(id)){

        liked.delete(id);

        button.classList.remove("liked");

    }else{

        liked.add(id);

        button.classList.add("liked");

    }


    localStorage.setItem(
        "shortflow_likes",
        JSON.stringify(
            [...liked]
        )
    );

}


/* ============================================================
   LIKES LADEN
============================================================ */

try{

    const saved =
        JSON.parse(
            localStorage.getItem(
                "shortflow_likes"
            ) || "[]"
        );


    liked =
        new Set(saved);

}catch(e){}


/* ============================================================
   SHARE
============================================================ */

async function shareVideo(id){

    const url =
        "https://www.youtube.com/shorts/" +
        id;


    if(navigator.share){

        try{

            await navigator.share({

                title:"YouTube Short",

                url:url

            });

        }catch(e){}

    }else{

        try{

            await navigator.clipboard.writeText(
                url
            );

            alert(
                "Short-Link kopiert!"
            );

        }catch(e){

            window.prompt(
                "Short-Link:",
                url
            );

        }

    }

}


/* ============================================================
   YOUTUBE ÖFFNEN
============================================================ */

function openYouTube(id){

    window.open(
        "https://www.youtube.com/shorts/" +
        id,
        "_blank",
        "noopener"
    );

}


/* ============================================================
   API HINWEIS
============================================================ */

function showApiMessage(){

    loadingScreen.innerHTML = `

        <div class="message">

            <div class="messageBox">

                <h1>ShortFlow</h1>

                <p>
                    Trage deinen YouTube Data API Key
                    oben im Code bei
                    <b>API_KEY</b> ein.
                </p>

                <p style="margin-top:12px">
                    Danach die Seite neu laden.
                </p>

            </div>

        </div>

    `;

}


/* ============================================================
   FEHLER
============================================================ */

function showError(message){

    feed.innerHTML = `

        <div class="message">

            <div class="messageBox">

                <h1>Shorts konnten nicht geladen werden</h1>

                <p>
                    ${escapeHTML(message)}
                </p>

                <button onclick="loadVideos(true)">
                    Erneut versuchen
                </button>

            </div>

        </div>

    `;

}


/* ============================================================
   TEXT BEREINIGEN
============================================================ */

function cleanText(text){

    const div =
        document.createElement("div");

    div.innerHTML = text;

    return div.textContent ||
           div.innerText ||
           text;

}


/* ============================================================
   HTML ESCAPE
============================================================ */

function escapeHTML(value){

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ============================================================
   START
============================================================ */

setTimeout(() => {

    loadingScreen.style.display =
        "none";

},300);


loadVideos(true);


/* ============================================================
   KEYBOARD NAVIGATION
============================================================ */

document.addEventListener(
    "keydown",
    event => {

        const sections =
            document.querySelectorAll(
                ".short"
            );


        if(!sections.length){
            return;
        }


        let current = 0;


        sections.forEach(
            (section,index) => {

                const rect =
                    section.getBoundingClientRect();


                if(
                    rect.top >= -100 &&
                    rect.top <= 100
                ){

                    current = index;

                }

            }
        );


        if(event.key === "ArrowDown"){

            event.preventDefault();

            sections[
                Math.min(
                    current + 1,
                    sections.length - 1
                )
            ].scrollIntoView({
                behavior:"smooth"
            });

        }


        if(event.key === "ArrowUp"){

            event.preventDefault();

            sections[
                Math.max(
                    current - 1,
                    0
                )
            ].scrollIntoView({
                behavior:"smooth"
            });

        }

    }
);

</script>

</body>
</html>
