<script type="module">

/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  addDoc,
  collection,
  onSnapshot,
  query,
  orderBy,
  serverTimestamp,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyBtU8j4zDEEQSGwOiaQF3qQ9qOJLyyq-I",
  authDomain: "box-opening.firebaseapp.com",
  projectId: "box-opening",
  storageBucket: "box-opening.firebasestorage.app",
  messagingSenderId: "191172808219",
  appId: "1:191172808219:web:ffe29445eba8b8eaccf2be"
};


/* =====================================================
   STATE
===================================================== */

let db = null;
let auth = null;
let user = null;
let firebaseReady = false;

let chats = [];
let currentChat = null;
let firebaseUnsubscribe = null;


/* =====================================================
   BOTS
===================================================== */

const bots = {

  nova:{
    name:"Nova",
    avatar:"🤖",
    status:"KI-Assistent",
    welcome:"Hey! 👋 Ich bin Nova.\nWie kann ich dir helfen?"
  },

  code:{
    name:"CodeBot",
    avatar:"💻",
    status:"Programmier-Bot",
    welcome:"Hallo! 💻\nIch helfe dir bei HTML, CSS und JavaScript."
  },

  learn:{
    name:"LernBot",
    avatar:"📚",
    status:"Lern-Assistent",
    welcome:"Hi! 📚\nWas möchtest du lernen?"
  },

  fun:{
    name:"FunBot",
    avatar:"🎮",
    status:"Fun-Bot",
    welcome:"🎮 Hey! Was geht?"
  }

};


/* =====================================================
   IDENTITY
===================================================== */

let myName=localStorage.getItem("chatlyName");

let myAvatar=localStorage.getItem("chatlyAvatar");


function createIdentity(){

  if(!myName){

    const names=[
      "Alex","Sam","Max","Luca",
      "Noah","Mia","Leo","Ben",
      "Tom","Jamie"
    ];

    myName=
      names[Math.floor(Math.random()*names.length)] +
      Math.floor(Math.random()*900+100);

    localStorage.setItem("chatlyName",myName);
  }


  if(!myAvatar){

    const avatars=[
      "🙂","😎","🦊","🐼",
      "🚀","⭐","🔥","🎮"
    ];

    myAvatar=
      avatars[Math.floor(Math.random()*avatars.length)];

    localStorage.setItem("chatlyAvatar",myAvatar);
  }

  document.getElementById("myName").textContent=myName;
  document.getElementById("myAvatar").textContent=myAvatar;
}


/* =====================================================
   LOCAL DATA
===================================================== */

function loadChats(){

  try{

    chats=
      JSON.parse(
        localStorage.getItem("chatlyChats") || "[]"
      );

  }catch{

    chats=[];
  }


  /*
    Bots hinzufügen
  */

  for(const key in bots){

    if(!chats.some(c=>c.bot===key)){

      chats.push({

        id:"bot_"+key,

        type:"bot",

        bot:key,

        name:bots[key].name,

        avatar:bots[key].avatar,

        status:bots[key].status,

        messages:[{

          id:"welcome",

          sender:"bot",

          senderName:bots[key].name,

          text:bots[key].welcome,

          time:Date.now()

        }]

      });
    }
  }

  saveChats();
}


function saveChats(){

  localStorage.setItem(
    "chatlyChats",
    JSON.stringify(chats)
  );
}


/* =====================================================
   RENDER CHATS
===================================================== */

function renderChats(){

  const list=document.getElementById("chatList");

  const search=
    document.getElementById("search")
      .value
      .toLowerCase();

  list.innerHTML="";


  const filtered=chats.filter(c=>
    c.name.toLowerCase().includes(search)
  );


  if(!filtered.length){

    list.innerHTML=`
      <div class="empty">
        Keine Chats gefunden.
      </div>
    `;

    return;
  }


  for(const c of filtered){

    const last=
      c.messages?.[c.messages.length-1];

    const item=document.createElement("div");

    item.className=
      "chatItem " +
      (currentChat?.id===c.id ? "active":"");


    item.innerHTML=`

      <div class="avatar">
        ${c.avatar || "💬"}
      </div>

      <div class="chatInfo">

        <div class="chatLine">

          <div class="chatName">
            ${safe(c.name)}
          </div>

          <div class="chatTime">
            ${last ? time(last.time) : ""}
          </div>

        </div>

        <div class="chatPreview">
          ${last ? safe(last.text) : "Noch keine Nachrichten"}
        </div>

      </div>
    `;


    item.onclick=()=>openChat(c.id);

    list.appendChild(item);
  }
}


/* =====================================================
   OPEN CHAT
===================================================== */

function openChat(id){

  const c=chats.find(x=>x.id===id);

  if(!c)return;

  currentChat=c;


  document.getElementById("chat")
    .classList.add("mobile");


  document.getElementById("chatAvatar").textContent=
    c.avatar || "💬";

  document.getElementById("chatName").textContent=
    c.name;

  document.getElementById("chatStatus").textContent=
    c.status || "online";

  document.getElementById("composer").style.display="flex";


  renderMessages();

  renderChats();


  /*
    Firebase nur bei Personen-Chats.
    Bots brauchen Firebase nicht.
  */

  if(
    firebaseReady &&
    db &&
    c.type==="person"
  ){

    listenToMessages(c.id);
  }

}


/* =====================================================
   FIREBASE LIVE MESSAGES
===================================================== */

function listenToMessages(chatId){

  if(firebaseUnsubscribe){

    firebaseUnsubscribe();
    firebaseUnsubscribe=null;
  }


  try{

    const messagesRef=
      collection(
        db,
        "chats",
        chatId,
        "messages"
      );


    const q=query(
      messagesRef,
      orderBy("createdAt","asc")
    );


    firebaseUnsubscribe=
      onSnapshot(
        q,
        snapshot=>{

          const chat=
            chats.find(c=>c.id===chatId);

          if(!chat)return;

          chat.messages=[];


          snapshot.forEach(item=>{

            const data=item.data();

            chat.messages.push({

              id:item.id,

              sender:
                data.senderId===user?.uid
                  ? "me"
                  : "other",

              senderName:
                data.senderName || "Nutzer",

              text:data.text || "",

              time:
                data.createdAt?.toMillis?.() ||
                Date.now()

            });

          });


          saveChats();

          if(currentChat?.id===chatId){

            renderMessages();
          }

          renderChats();

        },
        error=>{

          console.warn(
            "Firebase Nachrichten:",
            error
          );

        }
      );

  }catch(error){

    console.warn(error);
  }
}


/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages(){

  const box=document.getElementById("messages");

  box.innerHTML=`
    <div class="day">
      <span>HEUTE</span>
    </div>
  `;


  if(!currentChat)return;


  for(const msg of currentChat.messages || []){

    const row=document.createElement("div");

    row.className=
      "message " +
      (msg.sender==="me" ? "me":"");


    const bubble=document.createElement("div");

    bubble.className="bubble";


    if(
      msg.sender!=="me" &&
      currentChat.type==="person"
    ){

      const sender=document.createElement("div");

      sender.className="sender";

      sender.textContent=
        msg.senderName || "Nutzer";

      bubble.appendChild(sender);
    }


    const text=document.createElement("span");

    text.className="messageText";

    text.textContent=msg.text;

    bubble.appendChild(text);


    const meta=document.createElement("span");

    meta.className="meta";

    meta.textContent=time(msg.time);

    bubble.appendChild(meta);


    row.appendChild(bubble);

    box.appendChild(row);
  }


  box.scrollTop=box.scrollHeight;
}


/* =====================================================
   SEND
===================================================== */

async function sendMessage(){

  if(!currentChat)return;


  const input=
    document.getElementById("messageInput");

  const text=input.value.trim();

  if(!text)return;


  input.value="";


  const message={

    id:"local_"+Date.now(),

    sender:"me",

    senderName:myName,

    text:text,

    time:Date.now()

  };


  if(!currentChat.messages){

    currentChat.messages=[];
  }


  currentChat.messages.push(message);

  saveChats();

  renderMessages();

  renderChats();


  /*
    BOT
  */

  if(currentChat.type==="bot"){

    setTimeout(
      ()=>botAnswer(currentChat,text),
      500
    );

    return;
  }


  /*
    PERSON
  */

  if(firebaseReady && db && user){

    try{

      await addDoc(
        collection(
          db,
          "chats",
          currentChat.id,
          "messages"
        ),
        {
          senderId:user.uid,
          senderName:myName,
          text:text,
          createdAt:serverTimestamp()
        }
      );

    }catch(error){

      console.warn(error);

      toast("Nachricht lokal gespeichert");
    }
  }
}


/* =====================================================
   BOT ANSWERS
===================================================== */

function botAnswer(chat,text){

  const t=text.toLowerCase();

  let answer="";


  if(chat.bot==="nova"){

    if(t.includes("hallo") || t.includes("hi")){

      answer="Hey 👋 Schön, dass du da bist!";

    }else if(t.includes("wer bist")){

      answer="Ich bin Nova 🤖, der KI-Assistent von Chatly.";

    }else{

      answer=
        "Interessant! 🤖 Erzähl mir mehr.";
    }

  }


  if(chat.bot==="code"){

    if(t.includes("html")){

      answer=
        "HTML ist die Struktur einer Website. CSS macht das Design und JavaScript die Funktionen.";

    }else{

      answer=
        "💻 Ich bin CodeBot. Frag mich etwas zu HTML, CSS oder JavaScript.";
    }

  }


  if(chat.bot==="learn"){

    if(t.includes("mathe")){

      answer=
        "📚 Klar! Nenne mir dein Mathe-Thema und wir üben es Schritt für Schritt.";

    }else{

      answer=
        "📚 Sag mir einfach, welches Fach oder Thema du lernen möchtest.";
    }

  }


  if(chat.bot==="fun"){

    const answers=[
      "🔥 Nice!",
      "😎 Stark!",
      "😂 Okay!",
      "🚀 Let's go!",
      "🎮 Klingt gut!"
    ];

    answer=
      answers[
        Math.floor(Math.random()*answers.length)
      ];
  }


  chat.messages.push({

    id:"bot_"+Date.now(),

    sender:"bot",

    senderName:chat.name,

    text:answer,

    time:Date.now()

  });


  saveChats();

  renderMessages();

  renderChats();
}

===================================================== */

  if(chat){

/* =====================================================
   PERSON CHAT
===================================================== */

async function createPersonChat(){

  closeModal();


  const id=
    "chat_"+Date.now()+"_"+
    Math.random().toString(36).slice(2,8);


  const chat={

    id:id,

    type:"person",

    name:"Personen-Chat",

    avatar:"👤",

    status:"online",

    members:user ? [user.uid] : [],

    messages:[]

  };


  chats.push(chat);

  saveChats();

  renderChats();

  openChat(id);


  if(firebaseReady && db && user){

    try{

      await setDoc(
        doc(db,"chats",id),
        {
          members:[user.uid],
          createdBy:user.uid,
          createdAt:serverTimestamp()
        }
      );

    }catch(error){

      console.warn(error);
    }
  }


  invite();
}


/* =====================================================
   INVITE
===================================================== */

async function invite(){

  if(!currentChat){

    toast("Zuerst einen Chat öffnen");

    return;
  }


  const link=
    location.href.split("?")[0] +
    "?chat=" +
    encodeURIComponent(currentChat.id);


  showModal(`

    <h2>🔗 Chat-Link</h2>

    <p style="color:#667781;margin-bottom:12px">
      Teile diesen Link mit der anderen Person.
    </p>

    <div style="
      background:#f0f2f5;
      padding:12px;
      border-radius:8px;
      word-break:break-all;
      margin-bottom:12px;
      font-size:13px;
    ">
      ${safe(link)}
    </div>

    <button
      class="modalButton"
      onclick="copyLink()">
      📋 Link kopieren
    </button>

    <button
      class="modalClose"
      onclick="closeModal()">
      Schließen
    </button>

  `);


  window.currentInviteLink=link;
}


async function copyLink(){

  try{

    await navigator.clipboard.writeText(
      window.currentInviteLink
    );

    toast("Link kopiert ✓");

  }catch{

    toast("Kopieren nicht möglich");
  }
}


/* =====================================================
   CHECK INVITE
===================================================== */

async function checkInvite(){

  const params=
    new URLSearchParams(location.search);

  const chatId=params.get("chat");

  if(!chatId)return;


  let chat=
    chats.find(c=>c.id===chatId);


  /*
    Firebase Chat suchen
  */

  if(!chat && firebaseReady && db){

    try{

      const snap=
        await getDoc(
          doc(db,"chats",chatId)
        );


      if(snap.exists()){

        const data=snap.data();


        chat={

          id:chatId,

          type:"person",

          name:"Personen-Chat",

          avatar:"👤",

          status:"online",

          members:data.members || [],

          messages:[]

        };


        chats.push(chat);

        saveChats();
      }

    }catch(error){

      console.warn(error);
    }
  }


  /*
    Offline-Fallback
  */

  if(!chat){

    chat={

      id:chatId,

      type:"person",

      name:"Personen-Chat",

      avatar:"👤",

      status:"online",

      messages:[]

    };


    chats.push(chat);

    saveChats();
  }


  /*
    User hinzufügen
  */

  if(firebaseReady && db && user){

    try{

      const ref=
        doc(db,"chats",chatId);

      const snap=
        await getDoc(ref);


      if(snap.exists()){

        const data=snap.data();

        const members=
          data.members || [];


        if(!members.includes(user.uid)){

          await updateDoc(
            ref,
            {
              members:[
                ...members,
                user.uid
              ]
            }
          );
        }
      }

    }catch(error){

      console.warn(error);
    }
  }


  renderChats();

  openChat(chatId);


  history.replaceState(
    {},
    "",
    location.pathname
  );
}

    .classList.remove("mobile");

    firebaseUnsubscribe=null;
  }

  renderChats();
}

/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function toast(text){

  const t=document.getElementById("toast");

  t.textContent=text;

  t.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(
    ()=>t.classList.remove("show"),
    2200
  );
}


/* =====================================================
   HELPERS
===================================================== */

function time(value){

  if(!value)return "";

  return new Date(value)
    .toLocaleTimeString(
      "de-DE",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );
}


function safe(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =====================================================
   FIREBASE BACKGROUND CONNECTION
===================================================== */

async function connectFirebase(){

  try{

    /*
      Firebase initialisieren
      OHNE den App-Start abzuwarten.
    */

    const app=
      initializeApp(firebaseConfig);


    auth=getAuth(app);

    db=getFirestore(app);


    /*
      Anmeldung im Hintergrund.
      Die Website wartet NICHT darauf.
    */

    signInAnonymously(auth)
      .then(result=>{

        user=result.user;

        firebaseReady=true;

        console.log(
          "Firebase verbunden ✓"
        );


        /*
          Invite erst jetzt prüfen,
          falls Firebase beim Start noch nicht fertig war.
        */

        checkInvite();

      })
      .catch(error=>{

        console.warn(
          "Firebase Anmeldung fehlgeschlagen:",
          error
        );

        firebaseReady=false;

      });


  }catch(error){

    console.warn(
      "Firebase konnte nicht gestartet werden:",
      error
    );

    firebaseReady=false;
  }
}


/* =====================================================
   START APP
===================================================== */

function startApp(){

  /*
    1. Sofort lokale Daten laden
  */

  createIdentity();

  loadChats();

  renderChats();


  /*
    2. Oberfläche SOFORT anzeigen
  */

  document.getElementById("startup")
    .style.display="none";


  /*
    3. Firebase erst DANACH starten
  */

  setTimeout(
    connectFirebase,
    100
  );


  /*
    4. Invite aus URL lokal prüfen
  */

  checkInvite();

}
