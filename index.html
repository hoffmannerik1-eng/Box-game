<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Shorts</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#050505;
    color:white;
}

body{
    display:flex;
    flex-direction:column;
}

/* =========================
   HEADER
========================= */

.header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:70px;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;

    background:rgba(5,5,5,.82);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    color:#ff1744;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.search{
    width:260px;
    height:42px;

    border:none;
    outline:none;

    padding:0 16px;

    border-radius:22px;

    color:white;
    background:#191919;

    font-size:15px;
}

.search::placeholder{
    color:#888;
}

.header-button{
    height:42px;
    padding:0 17px;

    border:none;
    border-radius:22px;

    background:#202020;
    color:white;

    cursor:pointer;
    font-weight:700;
}

.header-button:hover{
    background:#303030;
}

/* =========================
   FILTER
========================= */

.filterbar{
    position:fixed;
    top:70px;
    left:0;
    right:0;

    height:58px;

    z-index:900;

    display:flex;
    align-items:center;

    gap:8px;

    padding:0 18px;

    overflow-x:auto;

    background:rgba(5,5,5,.75);
    backdrop-filter:blur(18px);
}

.filterbar::-webkit-scrollbar{
    display:none;
}

.filter{
    flex:none;

    border:1px solid #303030;

    background:#171717;
    color:#ddd;

    padding:9px 15px;

    border-radius:20px;

    cursor:pointer;

    font-weight:700;
}

.filter.active{
    background:white;
    color:black;
}

/* =========================
   SHORTS FEED
========================= */

.feed{
    position:absolute;

    top:128px;
    bottom:0;
    left:0;
    right:0;

    overflow-y:auto;
    overflow-x:hidden;

    scroll-snap-type:y mandatory;

    overscroll-behavior-y:contain;

    scrollbar-width:none;
}

.feed::-webkit-scrollbar{
    display:none;
}

/* =========================
   SHORT
========================= */

.short{
    position:relative;

    width:100%;
    height:calc(100vh - 128px);

    min-height:500px;

    scroll-snap-align:start;
    scroll-snap-stop:always;

    background:#000;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

.video-wrapper{
    position:relative;

    width:min(100%, 520px);
    height:100%;

    background:#000;
}

.video-wrapper iframe{
    position:absolute;

    width:100%;
    height:100%;

    left:0;
    top:0;

    border:0;
}

/* =========================
   GRADIENTS
========================= */

.short::before{
    content:"";

    position:absolute;

    z-index:2;

    pointer-events:none;

    left:0;
    right:0;
    bottom:0;

    height:40%;

    background:linear-gradient(
        transparent,
        rgba(0,0,0,.75)
    );
}

/* =========================
   INFO
========================= */

.info{
    position:absolute;

    z-index:10;

    left:calc(50% - min(50%, 260px) + 18px);
    bottom:22px;

    width:min(390px,70%);

    text-shadow:0 2px 5px #000;
}

.info h2{
    font-size:18px;
    margin-bottom:8px;
}

.info p{
    color:#ddd;
    font-size:14px;
}

.age{
    display:inline-block;

    margin-top:10px;

    padding:5px 9px;

    border-radius:8px;

    background:rgba(255,255,255,.16);

    font-size:12px;
    font-weight:800;
}

/* =========================
   ACTIONS
========================= */

.actions{
    position:absolute;

    z-index:20;

    right:calc(50% - min(50%, 260px) + 12px);
    bottom:25px;

    display:flex;
    flex-direction:column;

    gap:13px;
}

.action{
    width:50px;
    height:50px;

    border:0;

    border-radius:50%;

    background:rgba(25,25,25,.82);

    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:21px;

    cursor:pointer;

    backdrop-filter:blur(10px);
}

.action:hover{
    background:rgba(60,60,60,.9);
}

.action small{
    display:block;
    font-size:9px;
}

/* =========================
   EMPTY
========================= */

.empty{
    height:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:30px;
}

.empty h1{
    font-size:30px;
    margin-bottom:12px;
}

.empty p{
    color:#999;
    max-width:500px;
    line-height:1.5;
}

/* =========================
   MODAL
========================= */

.modal-bg{
    position:fixed;

    z-index:3000;

    inset:0;

    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.7);

    backdrop-filter:blur(12px);
}

.modal{
    width:min(500px,calc(100% - 30px));

    background:#161616;

    border:1px solid #333;

    border-radius:22px;

    padding:25px;

    box-shadow:0 20px 70px rgba(0,0,0,.6);
}

.modal h2{
    margin-bottom:20px;
}

.modal label{
    display:block;

    color:#aaa;

    font-size:13px;

    margin:13px 0 6px;
}

.modal input,
.modal select{
    width:100%;

    height:45px;

    padding:0 13px;

    border:1px solid #333;

    outline:none;

    border-radius:10px;

    background:#090909;
    color:white;
}

.modal-buttons{
    display:flex;
    justify-content:flex-end;
    gap:10px;

    margin-top:20px;
}

.cancel{
    background:#292929;
    color:white;
}

.add{
    background:white;
    color:black;
}

.modal button{
    border:0;

    padding:11px 18px;

    border-radius:10px;

    font-weight:800;

    cursor:pointer;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    z-index:5000;

    left:50%;
    bottom:30px;

    transform:translateX(-50%) translateY(20px);

    opacity:0;

    background:#fff;
    color:#000;

    padding:12px 18px;

    border-radius:12px;

    font-weight:700;

    transition:.25s;

    pointer-events:none;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .header{
        height:60px;
        padding:0 12px;
    }

    .logo{
        font-size:21px;
    }

    .search{
        width:150px;
        height:38px;
    }

    .header-button{
        width:38px;
        padding:0;
        font-size:0;
    }

    .header-button::after{
        content:"+";
        font-size:22px;
    }

    .filterbar{
        top:60px;
        height:52px;
    }

    .feed{
        top:112px;
    }

    .short{
        height:calc(100vh - 112px);
    }

    .info{
        left:15px;
        bottom:20px;
        width:70%;
    }

    .actions{
        right:12px;
        bottom:20px;
    }

    .action{
        width:45px;
        height:45px;
    }
}

/* =========================
   LANDSCAPE
========================= */

@media(max-height:550px){

    .short{
        min-height:420px;
    }

    .info{
        bottom:12px;
    }

    .actions{
        bottom:12px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="logo">
        Shorts<span>+</span>
    </div>

    <div class="header-right">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Shorts suchen..."
        >

        <button
            class="header-button"
            onclick="openAdd()"
        >
            + Short
        </button>

    </div>

</header>


<!-- =========================
     FILTER
========================= -->

<nav class="filterbar">

    <button
        class="filter active"
        data-age="all"
        onclick="setAge('all',this)"
    >
        Alle
    </button>

    <button
        class="filter"
        data-age="6"
        onclick="setAge('6',this)"
    >
        6+
    </button>

    <button
        class="filter"
        data-age="12"
        onclick="setAge('12',this)"
    >
        12+
    </button>

    <button
        class="filter"
        data-age="16"
        onclick="setAge('16',this)"
    >
        16+
    </button>

    <button
        class="filter"
        data-age="18"
        onclick="setAge('18',this)"
    >
        18+
    </button>

</nav>


<!-- =========================
     FEED
========================= -->

<main id="feed" class="feed"></main>


<!-- =========================
     ADD MODAL
========================= -->

<div id="modalBg" class="modal-bg">

    <div class="modal">

        <h2>Short hinzufügen</h2>

        <label>YouTube-Short-URL</label>

        <input
            id="urlInput"
            placeholder="https://youtube.com/shorts/..."
        >

        <label>Titel</label>

        <input
            id="titleInput"
            placeholder="Mein Short"
        >

        <label>Altersstufe</label>

        <select id="ageInput">

            <option value="6">6+</option>
            <option value="12" selected>12+</option>
            <option value="16">16+</option>
            <option value="18">18+</option>

        </select>

        <div class="modal-buttons">

            <button
                class="cancel"
                onclick="closeAdd()"
            >
                Abbrechen
            </button>

            <button
                class="add"
                onclick="addShort()"
            >
                Hinzufügen
            </button>

        </div>

    </div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =====================================================
   DATEN
===================================================== */

/*
   Trage hier deine YouTube-Shorts ein.

   Du brauchst nur die Video-ID.

   Beispiel:

   https://www.youtube.com/shorts/ABC123XYZ

   wird zu:

   ABC123XYZ
*/

let shorts = [

    {
        id:"jNQXAC9IVRw",
        title:"Beispiel Short",
        channel:"YouTube",
        age:12
    },

    {
        id:"aqz-KE-bpKQ",
        title:"Weiteres Beispiel",
        channel:"YouTube",
        age:6
    }

];


/* =====================================================
   LOCAL STORAGE
===================================================== */

const saved = localStorage.getItem("shortsPlus");

if(saved){

    try{

        const extra = JSON.parse(saved);

        if(Array.isArray(extra)){
            shorts = [...shorts,...extra];
        }

    }catch(e){

        console.log("Gespeicherte Shorts konnten nicht geladen werden.");

    }

}


/* =====================================================
   VARIABLEN
===================================================== */

let currentAge = "all";
let searchText = "";


/* =====================================================
   VIDEO-ID AUS URL
===================================================== */

function getVideoId(url){

    if(!url) return null;

    url = url.trim();

    /*
       Shorts URL
    */

    let match = url.match(
        /youtube\.com\/shorts\/([a-zA-Z0-9_-]{6,})/
    );

    if(match){
        return match[1];
    }

    /*
       normale YouTube URL
    */

    match = url.match(
        /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{6,})/
    );

    if(match){
        return match[1];
    }

    /*
       youtu.be
    */

    match = url.match(
        /youtu\.be\/([a-zA-Z0-9_-]{6,})/
    );

    if(match){
        return match[1];
    }

    /*
       Falls direkt eine ID eingegeben wird
    */

    if(/^[a-zA-Z0-9_-]{6,}$/.test(url)){
        return url;
    }

    return null;
}


/* =====================================================
   FEED RENDERN
===================================================== */

function render(){

    const feed = document.getElementById("feed");

    feed.innerHTML = "";

    let filtered = shorts.filter(short => {

        /*
           Altersfilter
        */

        if(
            currentAge !== "all" &&
            Number(short.age) < Number(currentAge)
        ){
            return false;
        }

        /*
           Suche
        */

        if(searchText){

            const text = (
                short.title +
                " " +
                short.channel
            ).toLowerCase();

            if(!text.includes(searchText.toLowerCase())){
                return false;
            }

        }

        return true;

    });


    if(filtered.length === 0){

        feed.innerHTML = `

            <section class="empty">

                <h1>Keine Shorts gefunden</h1>

                <p>
                    Für deinen Filter oder deine Suche
                    wurden keine Shorts gefunden.
                    Füge über „+ Short“ ein YouTube Short hinzu.
                </p>

            </section>

        `;

        return;

    }


    filtered.forEach((short,index)=>{

        const section = document.createElement("section");

        section.className = "short";

        section.innerHTML = `

            <div class="video-wrapper">

                <iframe
                    src="https://www.youtube.com/embed/${short.id}?rel=0&playsinline=1"
                    title="${escapeHTML(short.title)}"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>

            </div>


            <div class="info">

                <h2>
                    ${escapeHTML(short.title)}
                </h2>

                <p>
                    @${escapeHTML(short.channel || "YouTube")}
                </p>

                <span class="age">
                    ${short.age}+
                </span>

            </div>


            <div class="actions">

                <button
                    class="action"
                    onclick="likeShort(this)"
                    title="Gefällt mir"
                >
                    ♥
                </button>

                <button
                    class="action"
                    onclick="openYouTube('${short.id}')"
                    title="Auf YouTube öffnen"
                >
                    ▶
                </button>

                <button
                    class="action"
                    onclick="shareShort('${short.id}')"
                    title="Teilen"
                >
                    ↗
                </button>

            </div>

        `;

        feed.appendChild(section);

    });

}


/* =====================================================
   HTML SICHER MACHEN
===================================================== */

function escapeHTML(value){

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   ALTERSFILTER
===================================================== */

function setAge(age,button){

    currentAge = age;

    document.querySelectorAll(".filter")
        .forEach(btn=>{
            btn.classList.remove("active");
        });

    button.classList.add("active");

    render();

}


/* =====================================================
   SUCHE
===================================================== */

document
.getElementById("search")
.addEventListener("input",function(){

    searchText = this.value;

    render();

});


/* =====================================================
   ADD MODAL
===================================================== */

function openAdd(){

    document
        .getElementById("modalBg")
        .style.display = "flex";

    document
        .getElementById("urlInput")
        .focus();

}


function closeAdd(){

    document
        .getElementById("modalBg")
        .style.display = "none";

}


/* =====================================================
   SHORT HINZUFÜGEN
===================================================== */

function addShort(){

    const url =
        document.getElementById("urlInput").value;

    const title =
        document.getElementById("titleInput").value ||
        "Neues Short";

    const age =
        Number(
            document.getElementById("ageInput").value
        );

    const id = getVideoId(url);


    if(!id){

        showToast(
            "Keine gültige YouTube-URL gefunden."
        );

        return;

    }


    /*
       Prüfen, ob schon vorhanden
    */

    if(shorts.some(short=>short.id === id)){

        showToast(
            "Dieses Short ist bereits vorhanden."
        );

        return;

    }


    const newShort = {

        id:id,

        title:title,

        channel:"YouTube",

        age:age

    };


    shorts.push(newShort);


    /*
       Nur eigene Shorts speichern.
       Die beiden Demo-Shorts bleiben im Code.
    */

    const ownShorts =
        shorts.slice(2);

    localStorage.setItem(
        "shortsPlus",
        JSON.stringify(ownShorts)
    );


    document.getElementById("urlInput").value = "";
    document.getElementById("titleInput").value = "";

    closeAdd();

    render();

    showToast("Short hinzugefügt.");

}


/* =====================================================
   LIKE
===================================================== */

function likeShort(button){

    if(button.dataset.liked === "true"){

        button.dataset.liked = "false";

        button.style.transform = "";

        showToast("Gefällt mir entfernt.");

    }else{

        button.dataset.liked = "true";

        button.style.transform = "scale(1.2)";

        showToast("Gefällt mir!");

    }

}


/* =====================================================
   YOUTUBE ÖFFNEN
===================================================== */

function openYouTube(id){

    window.open(
        "https://www.youtube.com/shorts/" + id,
        "_blank"
    );

}


/* =====================================================
   TEILEN
===================================================== */

async function shareShort(id){

    const url =
        "https://www.youtube.com/shorts/" + id;


    if(navigator.share){

        try{

            await navigator.share({

                title:"YouTube Short",
                url:url

            });

        }catch(e){}

    }else{

        try{

            await navigator.clipboard.writeText(url);

            showToast(
                "Short-Link kopiert."
            );

        }catch(e){

            showToast(url);

        }

    }

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(text){

    const toast =
        document.getElementById("toast");

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(()=>{

        toast.classList.remove("show");

    },2000);

}


/* =====================================================
   MODAL AUF BACKGROUND SCHLIESSEN
===================================================== */

document
.getElementById("modalBg")
.addEventListener("click",function(e){

    if(e.target === this){
        closeAdd();
    }

});


/* =====================================================
   ESC
===================================================== */

document.addEventListener("keydown",function(e){

    if(e.key === "Escape"){
        closeAdd();
    }

});


/* =====================================================
   START
===================================================== */

render();

</script>

</body>
</html>
