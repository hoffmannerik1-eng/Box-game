<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  addDoc,
  setDoc,
  getDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  onSnapshot,
  query,
  orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyBtU8j4zDEEQSGwOiaQF3qQ9qOJLyyq-I",
  authDomain: "box-opening.firebaseapp.com",
  projectId: "box-opening",
  storageBucket: "box-opening.firebasestorage.app",
  messagingSenderId: "191172808219",
  appId: "1:191172808219:web:ffe29445eba8b8eaccf2be"
};


/* =====================================================
   APP STATE
===================================================== */

let firebaseOK = false;
let db = null;
let auth = null;
let user = null;

let chats = [];
let currentChat = null;
let unsubscribeMessages = null;

let myName = localStorage.getItem("chatly_name");
let myAvatar = localStorage.getItem("chatly_avatar");

const BOT_DATA = {
  nova:{
    name:"Nova",
    avatar:"🤖",
    status:"KI-Assistent",
    welcome:"Hey! Ich bin Nova 🤖\nWie kann ich dir helfen?"
  },

  code:{
    name:"CodeBot",
    avatar:"💻",
    status:"Programmier-Bot",
    welcome:"Hallo! 👨‍💻\nIch helfe dir bei HTML, CSS, JavaScript und Programmierung."
  },

  learn:{
    name:"LernBot",
    avatar:"📚",
    status:"Lern-Assistent",
    welcome:"Hi! 📚\nWas möchtest du heute lernen?"
  },

  fun:{
    name:"FunBot",
    avatar:"🎮",
    status:"Fun-Bot",
    welcome:"Yo! 🎮\nLust auf einen kleinen Chat?"
  }
};


/* =====================================================
   STARTUP
===================================================== */

async function start(){

  document.getElementById("startText").textContent =
    "Chatly wird gestartet…";

  createIdentity();

  /*
    Firebase darf niemals verhindern,
    dass die Oberfläche startet.
  */

  try{

    const app = initializeApp(firebaseConfig);

    auth = getAuth(app);
    db = getFirestore(app);

    await signInAnonymously(auth);

    firebaseOK = true;

    document.getElementById("startText").textContent =
      "Verbunden ✓";

  }catch(error){

    console.warn("Firebase nicht verfügbar:",error);

    firebaseOK = false;

    document.getElementById("startText").textContent =
      "Offline-Modus wird gestartet…";
  }

  await loadLocalChats();

  setTimeout(()=>{
    document.getElementById("startup").style.display="none";
  },350);

  renderChats();

  checkInvite();

}


/* =====================================================
   IDENTITY
===================================================== */

function createIdentity(){

  if(!myName){

    const names=[
      "Alex","Sam","Chris","Max",
      "Luca","Noah","Mia","Leo",
      "Tom","Ben","Erik","Jamie"
    ];

    myName =
      names[Math.floor(Math.random()*names.length)] +
      Math.floor(100+Math.random()*900);

    localStorage.setItem("chatly_name",myName);
  }

  if(!myAvatar){

    const avatars=[
      "🙂","😎","🦊","🐼","🐸",
      "🚀","⭐","🔥","🎮","🤖"
    ];

    myAvatar =
      avatars[Math.floor(Math.random()*avatars.length)];

    localStorage.setItem("chatly_avatar",myAvatar);
  }

  document.getElementById("myName").textContent=myName;
  document.getElementById("myAvatar").textContent=myAvatar;
}


/* =====================================================
   LOCAL STORAGE
===================================================== */

async function loadLocalChats(){

  try{

    const saved =
      JSON.parse(localStorage.getItem("chatly_chats") || "[]");

    chats=saved;

  }catch{

    chats=[];
  }

  /*
    Standard-Bots automatisch anlegen
  */

  for(const key of Object.keys(BOT_DATA)){

    const exists=chats.find(x=>x.bot===key);

    if(!exists){

      chats.push({
        id:"bot_"+key,
        type:"bot",
        bot:key,
        name:BOT_DATA[key].name,
        avatar:BOT_DATA[key].avatar,
        status:BOT_DATA[key].status,
        messages:[{
          id:"welcome_"+key,
          sender:"bot",
          senderName:BOT_DATA[key].name,
          text:BOT_DATA[key].welcome,
          time:Date.now()
        }]
      });

    }
  }

  saveLocalChats();
}


function saveLocalChats(){

  localStorage.setItem(
    "chatly_chats",
    JSON.stringify(chats)
  );
}


/* =====================================================
   CHAT LIST
===================================================== */

function renderChats(){

  const list=document.getElementById("chatList");
  const search=
    document.getElementById("searchInput").value
      .toLowerCase();

  list.innerHTML="";

  const filtered=chats.filter(c=>
    c.name.toLowerCase().includes(search)
  );

  if(!filtered.length){

    list.innerHTML=`
      <div class="empty">
        <strong>Keine Chats</strong>
        Starte einen neuen Chat.
      </div>
    `;

    return;
  }

  filtered.sort((a,b)=>{

    const ta=a.messages?.length
      ? a.messages[a.messages.length-1].time || 0
      : 0;

    const tb=b.messages?.length
      ? b.messages[b.messages.length-1].time || 0
      : 0;

    return tb-ta;
  });


  for(const chat of filtered){

    const last=
      chat.messages?.[chat.messages.length-1];

    const preview=
      last
        ? (last.sender==="me" ? "Du: " : "") + last.text
        : "Noch keine Nachrichten";

    const time=
      last
        ? formatTime(last.time)
        : "";

    const div=document.createElement("div");

    div.className=
      "chat-item " +
      (currentChat?.id===chat.id ? "active":"");

    div.innerHTML=`

      <div class="avatar">
        ${chat.avatar || "💬"}
      </div>

      <div class="chat-main">

        <div class="chat-row">

          <div class="chat-name">
            ${escapeHtml(chat.name)}
          </div>

          <div class="chat-time">
            ${time}
          </div>

        </div>

        <div class="chat-preview">
          ${escapeHtml(preview)}
        </div>

      </div>
    `;

    div.onclick=()=>openChat(chat.id);

    list.appendChild(div);
  }
}


/* =====================================================
   OPEN CHAT
===================================================== */

async function openChat(id){

  const chat=chats.find(c=>c.id===id);

  if(!chat)return;

  currentChat=chat;

  document.getElementById("chatPanel")
    .classList.add("mobile-open");

  document.getElementById("chatAvatar").textContent=
    chat.avatar || "💬";

  document.getElementById("chatName").textContent=
    chat.name;

  document.getElementById("chatStatus").textContent=
    chat.status ||
    (chat.type==="bot" ? "KI-Bot" : "online");

  document.getElementById("composer").style.display="flex";

  renderMessages();

  renderChats();

  /*
    Wenn Firebase verfügbar ist,
    Nachrichten zusätzlich live synchronisieren.
  */

  if(unsubscribeMessages){

    unsubscribeMessages();
    unsubscribeMessages=null;
  }

  if(firebaseOK && db && !chat.type==="bot"){

    listenFirebaseMessages(chat.id);
  }

  /*
    Für Personenchats immer versuchen.
  */

  if(firebaseOK && db && chat.type==="person"){

    listenFirebaseMessages(chat.id);
  }

}


/* =====================================================
   FIREBASE MESSAGE LISTENER
===================================================== */

function listenFirebaseMessages(chatId){

  try{

    const ref=collection(
      db,
      "chats",
      chatId,
      "messages"
    );

    const q=query(
      ref,
      orderBy("createdAt","asc")
    );

    unsubscribeMessages=onSnapshot(q,(snap)=>{

      const chat=chats.find(c=>c.id===chatId);

      if(!chat)return;

      chat.messages=[];

      snap.forEach(d=>{

        const data=d.data();

        chat.messages.push({

          id:d.id,

          sender:
            data.senderId===user?.uid
              ? "me"
              : "other",

          senderName:
            data.senderName || "Nutzer",

          text:data.text || "",

          time:
            data.createdAt?.toMillis?.() ||
            Date.now()
        });

      });

      saveLocalChats();

      if(currentChat?.id===chatId){

        renderMessages();
      }

      renderChats();

    });

  }catch(error){

    console.warn(error);
  }
}


/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages(){

  const box=document.getElementById("messages");

  box.innerHTML="";

  if(!currentChat)return;

  const messages=currentChat.messages || [];

  const day=document.createElement("div");

  day.className="day";

  day.innerHTML="<span>HEUTE</span>";

  box.appendChild(day);


  for(const msg of messages){

    const row=document.createElement("div");

    row.className=
      "message " +
      (msg.sender==="me" ? "me":"");


    const bubble=document.createElement("div");

    bubble.className="bubble";


    let sender="";

    if(
      msg.sender!=="me" &&
      currentChat.type==="person"
    ){

      sender=`
        <div class="sender">
          ${escapeHtml(msg.senderName || "Nutzer")}
        </div>
      `;
    }

    const bot=
      currentChat.type==="bot" &&
      msg.sender==="bot"
        ? `<span class="bot-badge">BOT</span>`
        : "";


    bubble.innerHTML=`

      ${sender}

      <span class="message-text">
        ${escapeHtml(msg.text)}
      </span>

      ${bot}

      <span class="meta">
        ${formatTime(msg.time)}
      </span>
    `;

    row.appendChild(bubble);

    box.appendChild(row);
  }

  box.scrollTop=box.scrollHeight;
}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  if(!currentChat)return;

  const input=document.getElementById("messageInput");

  const text=input.value.trim();

  if(!text)return;

  input.value="";

  const msg={

    id:"local_"+Date.now(),

    sender:"me",

    senderName:myName,

    text:text,

    time:Date.now()
  };


  if(!currentChat.messages){

    currentChat.messages=[];
  }

  currentChat.messages.push(msg);

  saveLocalChats();

  renderMessages();

  renderChats();


  /*
    Bot
  */

  if(currentChat.type==="bot"){

    setTimeout(()=>{

      botReply(currentChat,text);

    },500);

    return;
  }


  /*
    Person + Firebase
  */

  if(firebaseOK && db && user){

    try{

      await addDoc(
        collection(
          db,
          "chats",
          currentChat.id,
          "messages"
        ),
        {
          senderId:user.uid,
          senderName:myName,
          text:text,
          createdAt:serverTimestamp()
        }
      );

    }catch(error){

      console.warn(error);

      toast("Lokal gespeichert");
    }
  }
}


/* =====================================================
   BOT SYSTEM
===================================================== */

function botReply(chat,text){

  const lower=text.toLowerCase();

  let reply="";

  if(chat.bot==="nova"){

    if(lower.includes("hallo") ||
       lower.includes("hi")){

      reply="Hey 👋 Schön, dass du da bist!";

    }else if(
      lower.includes("wer bist") ||
      lower.includes("name")
    ){

      reply="Ich bin Nova, dein Chatly-KI-Bot 🤖";

    }else if(
      lower.includes("danke")
    ){

      reply="Gerne! 😊";

    }else{

      reply=
        "Interessant! 🤖 Erzähl mir mehr darüber.";
    }
  }


  if(chat.bot==="code"){

    if(lower.includes("html")){

      reply=
        "HTML baut die Struktur einer Website auf. CSS macht das Design und JavaScript sorgt für Funktionen.";

    }else if(lower.includes("javascript") ||
             lower.includes("js")){

      reply=
        "JavaScript macht Websites interaktiv – zum Beispiel Buttons, Chats, Spiele und Apps.";

    }else{

      reply=
        "Ich bin CodeBot 💻. Schreib mir z.B. „Erkläre mir HTML“.";
    }
  }


  if(chat.bot==="learn"){

    if(lower.includes("mathe")){

      reply=
        "📚 Mathe können wir Schritt für Schritt üben. Schreib mir einfach das Thema.";

    }else if(lower.includes("englisch")){

      reply=
        "🇬🇧 Klar! Ich kann dir beim Lernen von Vokabeln und Grammatik helfen.";

    }else{

      reply=
        "📚 Ich helfe dir beim Lernen. Nenne mir dein Fach oder Thema.";
    }
  }


  if(chat.bot==="fun"){

    const answers=[
      "🎮 Klingt gut!",
      "😎 Nice!",
      "🔥 Das ist interessant!",
      "😂 Okay, das war gut!",
      "🚀 Weiter geht's!"
    ];

    reply=
      answers[Math.floor(Math.random()*answers.length)];
  }


  const msg={

    id:"bot_"+Date.now(),

    sender:"bot",

    senderName:chat.name,

    text:reply,

    time:Date.now()
  };

  chat.messages.push(msg);

  saveLocalChats();

  renderMessages();

  renderChats();
}

/* =====================================================
   INVITE CHECK
===================================================== */

async function checkInvite(){

  const params=new URLSearchParams(location.search);

  const chatId=params.get("chat");

  if(!chatId)return;


  let chat=chats.find(c=>c.id===chatId);


  /*
    Firebase Chat laden
  */

  if(!chat && firebaseOK && db){

    try{

      const snap=
        await getDoc(doc(db,"chats",chatId));

      if(snap.exists()){

        const data=snap.data();

        chat={

          id:chatId,

          type:"person",

          name:"Chat mit Person",

          avatar:"👤",

          status:"online",

          members:data.members || [],

          messages:[]
        };

        chats.push(chat);

        saveLocalChats();
      }

    }catch(error){

      console.warn(error);
    }
  }


  if(!chat){

    /*
      Offline fallback
    */

    chat={

      id:chatId,

      type:"person",

      name:"Chat mit Person",

      avatar:"👤",

      status:"online",

      messages:[]
    };

    chats.push(chat);

    saveLocalChats();
  }


  /*
    User hinzufügen
  */

  if(
    firebaseOK &&
    db &&
    user
  ){

    try{

      const ref=doc(db,"chats",chatId);

      const snap=await getDoc(ref);

      if(snap.exists()){

        const data=snap.data();

        const members=data.members || [];

        if(!members.includes(user.uid)){

          await updateDoc(ref,{
            members:[
              ...members,
              user.uid
            ]
          });
        }
      }

    }catch(error){

      console.warn(error);
    }
  }


  renderChats();

  openChat(chatId);

  history.replaceState(
    {},
    "",
    location.pathname
  );
}

/* =====================================================

===================================================== */

function formatTime(time){

  if(!time)return "";

  return new Date(time)
    .toLocaleTimeString(
      "de-DE",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );
}


function escapeHtml(str){

  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function escapeAttribute(str){

  return String(str)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");
}
